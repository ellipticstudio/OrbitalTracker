<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLE ANALYSER</title>
  <!-- Chargement de satellite.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 1.25rem; margin-top: 0; color: #38bdf8; }
    .metric { margin: 12px 0; font-size: 1.1rem; }
    .label { color: #94a3b8; }
    .value { font-weight: bold; color: #f1f5f9; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="sat-name">Calcul en cours...</h1>
    <div class="metric"><span class="label">Latitude :</span> <span id="lat" class="value">-</span></div>
    <div class="metric"><span class="label">Longitude :</span> <span id="lng" class="value">-</span></div>
    <div class="metric"><span class="label">Altitude :</span> <span id="alt" class="value">-</span> km</div>
    <div class="metric"><span class="label">Mise à jour :</span> <span id="time" class="value">-</span></div>
  </div>

  <script>
    // Données TLE (Exemple : ISS - ZARYA)
    const tleLine1 = '1 25544U 98067A   24080.52843720  .00015523  00000+0  27572-3 0  9993';
    const tleLine2 = '2 25544  51.6416 288.4239 0004381 122.2514 308.1751 15.49814420445098';
    const satName = 'ISS (ZARYA)';

    function updatePosition() {
      // 1. Initialisation de l'enregistrement satellite à partir du TLE
      const satrec = satellite.twoline2satrec(tleLine1, tleLine2);
      
      // 2. Horodatage actuel
      const now = new Date();

      // 3. Propagation SGP4 pour obtenir la position (ECI) et la vitesse
      const positionAndVelocity = satellite.propagate(satrec, now);
      const positionEci = positionAndVelocity.position;

      if (!positionEci) {
        console.error("Erreur de calcul SGP4");
        return;
      }

      // 4. Calcul du temps sidéral de Greenwich (GMST)
      const gmst = satellite.gstime(now);

      // 5. Conversion ECI -> Coordonnées géodétiques (radians)
      const positionGd = satellite.eciToGeodetic(positionEci, gmst);

      // 6. Conversion radians -> degrés et altitude en km
      const longitude = satellite.degreesLong(positionGd.longitude);
      const latitude = satellite.degreesLat(positionGd.latitude);
      const altitude = positionGd.height; // Déjà en km

      // 7. Affichage dans le DOM
      document.getElementById('sat-name').textContent = satName;
      document.getElementById('lat').textContent = latitude.toFixed(4) + '°';
      document.getElementById('lng').textContent = longitude.toFixed(4) + '°';
      document.getElementById('alt').textContent = altitude.toFixed(2);
      document.getElementById('time').textContent = now.toLocaleTimeString();
    }

    // Premier calcul immédiat
    updatePosition();

    // Actualisation de la position toutes les secondes
    setInterval(updatePosition, 1000);
  </script>
</body>
</html>
