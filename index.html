  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;

      background-color: #030712; 
    }

      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);

    }

    .leaflet-container { 
      background: #080c14 !important; 
    }

    @keyframes radar-pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.6); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

  <script>
    // Familles prédéfinies pour le mode en ligne et local (~50 satellites répartis par collections)
    const CODE_PRESET_FAMILIES = [
      {
        id: 'code_ens',
        name: 'ENS',
        noradIds: ['38755', '40053', '48268', '49070']
      },
      {
        id: 'code_arabsat',
        name: 'ARABSAT',
        noradIds: ['36745', '36592', '41029']
      }
    ];

    // Variables d'état global
    let currentMode = 'online';
    let currentSatellites = [];
    let filteredSatellites = [];
    let selectedSatName = "";
    let selectedNoradId = "";
    let selectedCurrentEpoch = "";
    let selectedEpoch = "";
    let selectedLine1 = "";
    let selectedLine2 = "";
    let selectedSatrec = null;
    let marker = null;
    let orbitLines = [];
    let graticuleLayer = null;
    let nightLayer = null;
    let localTleCache = null;

    // Références des éléments du DOM
    const modeSelect = document.getElementById('mode-select');
    const catSelect = document.getElementById('cat-select');
    const satSearch = document.getElementById('sat-search');
    const satSelect = document.getElementById('sat-select');
    const satCount = document.getElementById('sat-count');
    const quickNoradInput = document.getElementById('quick-norad-input');
    const btnQuickFetch = document.getElementById('btn-quick-fetch');
    const localFileInput = document.getElementById('local-file-input');
    const satInfoDiv = document.getElementById('sat-info');
    const btnRecenter = document.getElementById('btn-recenter');
    const btnRecenterMap = document.getElementById('btn-recenter-map');
    const toggleGrid = document.getElementById('toggle-grid');
    const toggleNight = document.getElementById('toggle-night');
    const statusEl = document.getElementById('status-text');

    // Initialisation de la carte Leaflet EPSG4326
    const mapBounds = [[-90, -180], [90, 180]];
    const map = L.map('map', {
      crs: L.CRS.EPSG4326,
      center: [0, 0],
      zoom: 2,
      minZoom: 1,
      maxZoom: 8,
      maxBounds: mapBounds,
      maxBoundsViscosity: 1.0,
      worldCopyJump: false
    });

    // Chargement de l'image de fond
    const mapImageOverlay = L.imageOverlay('./maps/Blue_Marble_2002.jpg', mapBounds, {
      opacity: 1.0,
      interactive: false
    }).addTo(map);

    // Icône personnalisée satellite
    const satIcon = L.divIcon({
      className: 'custom-sat-icon',
      html: `
        <div class="relative flex items-center justify-center w-8 h-8">
          <span class="absolute w-8 h-8 rounded-full bg-sky-500/30 pulse-ring"></span>
          <span class="relative w-4 h-4 rounded-full bg-sky-400 border-2 border-white shadow-lg flex items-center justify-center">
            <i class="fa-solid fa-satellite text-[8px] text-slate-950"></i>
          </span>
        </div>
      `,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    function createGraticuleLayer() {
      const lines = [];
      for (let lat = -90; lat <= 90; lat += 15) {
        const color = (lat === 0) ? '#06b6d4' : '#334155';
        const weight = (lat === 0) ? 2 : 1;
        const polyline = L.polyline([[lat, -180], [lat, 180]], { color, weight, opacity: 0.5, dashArray: lat === 0 ? null : '4, 4' });
        lines.push(polyline);
      }
      for (let lng = -180; lng <= 180; lng += 15) {
        const color = (lng === 0) ? '#06b6d4' : '#334155';
        const weight = (lng === 0) ? 2 : 1;
        const polyline = L.polyline([[-90, lng], [90, lng]], { color, weight, opacity: 0.5, dashArray: lng === 0 ? null : '4, 4' });
        lines.push(polyline);
      }
      return L.layerGroup(lines);
    }

    function getSolarPosition(date) {
      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;
      const julianDate = date.getTime() / 86400000 + 2440587.5;
      const d = julianDate - 2451545.0;

      const L_sun = (280.460 + 0.9856474 * d) % 360;
      const M_sun = ((357.528 + 0.9856003 * d) % 360) * rad;
      const lambda = (L_sun + 1.915 * Math.sin(M_sun) + 0.020 * Math.sin(2 * M_sun)) * rad;
      const obq = (23.439 - 0.0000004 * d) * rad;

      const sinDec = Math.sin(obq) * Math.sin(lambda);
      const latSun = Math.asin(sinDec) * deg;

      const ra = Math.atan2(Math.cos(obq) * Math.sin(lambda), Math.cos(lambda)) * deg;
      const gmst = (280.46061837 + 360.98564736629 * d) % 360;
      let lngSun = ra - gmst;
      while (lngSun > 180) lngSun -= 360;
      while (lngSun < -180) lngSun += 360;

      return { lat: latSun, lng: lngSun };
    }

    function getSunPositionECI(date) {
      const jd = (date.getTime() / 86400000) + 2440587.5;
      const T = (jd - 2451545.0) / 36525;
      const rad = Math.PI / 180;

      const L0 = (280.46646 + 36000.76983 * T) % 360;
      const M = ((357.52911 + 35999.05029 * T) % 360) * rad;

      const C = (1.914602 - 0.004817 * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M);
      const lambda = ((L0 + C) % 360) * rad;
      const epsilon = (23.439291 - 0.0130042 * T) * rad;

      return {
        x: Math.cos(lambda),
        y: Math.cos(epsilon) * Math.sin(lambda),
        z: Math.sin(epsilon) * Math.sin(lambda)
      };
    }

    function getEclipseState(positionEci, date) {
      if (!positionEci || typeof positionEci.x !== 'number') {
        return { label: 'Inconnu', icon: 'fa-question', colorClass: 'bg-slate-800 text-slate-400 border-slate-700' };
      }

      const sunUnit = getSunPositionECI(date);
      const RE = 6378.137;
      const RS = 696000;
      const AU = 149597870.7;

      const dProj = positionEci.x * sunUnit.x + positionEci.y * sunUnit.y + positionEci.z * sunUnit.z;

      if (dProj >= 0) {
        return { label: 'Plein Soleil', icon: 'fa-sun', colorClass: 'bg-amber-500/20 text-amber-300 border-amber-500/30' };
      }

      const rSatSq = positionEci.x ** 2 + positionEci.y ** 2 + positionEci.z ** 2;
      const dPerp = Math.sqrt(Math.max(0, rSatSq - dProj ** 2));
      const zShadow = Math.abs(dProj);

      const alphaUmbra = Math.asin((RS - RE) / AU);
      const alphaPenumbra = Math.asin((RS + RE) / AU);

      const rUmbra = RE - zShadow * Math.tan(alphaUmbra);
      const rPenumbra = RE + zShadow * Math.tan(alphaPenumbra);

      if (dPerp <= Math.max(0, rUmbra)) {
        return { label: 'Éclipse (Ombre)', icon: 'fa-moon', colorClass: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30' };
      } else if (dPerp <= rPenumbra) {
        return { label: 'Pénombre', icon: 'fa-cloud-sun', colorClass: 'bg-purple-500/20 text-purple-300 border-purple-500/30' };
      } else {
        return { label: 'Plein Soleil', icon: 'fa-sun', colorClass: 'bg-amber-500/20 text-amber-300 border-amber-500/30' };
      }
    }

    function updateNightMask() {
      if (!toggleNight || !toggleNight.checked) {
        if (nightLayer) {
          map.removeLayer(nightLayer);
          nightLayer = null;
        }
        return;
      }

      const now = new Date();
      const sunPos = getSolarPosition(now);
      const latSun = sunPos.lat;
      const lngSun = sunPos.lng;

      const points = [];
      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;

      for (let lng = -180; lng <= 180; lng += 1) {
        const dLng = (lng - lngSun) * rad;
        let termLat;
        if (Math.abs(latSun) < 0.0001) {
          termLat = 0;
        } else {
          const tanLatSun = Math.tan(latSun * rad);
          const tanTermLat = -Math.cos(dLng) / tanLatSun;
          termLat = Math.atan(tanTermLat) * deg;
        }
        termLat = Math.max(-90, Math.min(90, termLat));
        points.push([termLat, lng]);
      }

      const nightPolyCoords = [];
      if (latSun >= 0) {
        nightPolyCoords.push(...points);
        nightPolyCoords.push([-90, 180]);
        nightPolyCoords.push([-90, -180]);
      } else {
        nightPolyCoords.push(...points);
        nightPolyCoords.push([90, 180]);
        nightPolyCoords.push([90, -180]);
      }

      if (nightLayer) {
        map.removeLayer(nightLayer);
      }

      nightLayer = L.polygon(nightPolyCoords, {
        color: '#312e81',
        fillColor: '#020617',
        fillOpacity: 0.55,
        weight: 1.5,
        stroke: true,
        interactive: false
      }).addTo(map);
    }

    function tleEpochToGregorianUTC(epochYearStr, epochDayStr) {
      let year = parseInt(epochYearStr, 10);
      year += (year < 57) ? 2000 : 1900;
      const dayOfYear = parseFloat(epochDayStr);
      const startOfYear = Date.UTC(year, 0, 1, 0, 0, 0);
      const epochMs = startOfYear + (dayOfYear - 1) * 86400 * 1000;
      const d = new Date(epochMs);
      return d.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
    }

    function parseSingleTLE(name, noradId, line1, line2) {
      const epochYear = line1.substring(18, 20);
      const epochDay = line1.substring(20, 32);
      const epochUTC = tleEpochToGregorianUTC(epochYear, epochDay);
      return {
        OBJECT_NAME: name || `SAT-${noradId}`,
        NORAD_CAT_ID: noradId,
        EPOCH: epochUTC,
        line1: line1,
        line2: line2
      };
    }

    function parseTLEText(tleText) {
      if (!tleText) return [];
      const rawLines = tleText.split(/\r?\n/).map(l => l.trim());
      const sats = [];

      let i = 0;
      while (i < rawLines.length) {
        const line = rawLines[i];
        
        // Vérification si la ligne courante est une ligne 1 TLE valide
        if (line.startsWith('1 ') && line.length >= 60) {
          if (i + 1 < rawLines.length && rawLines[i + 1].startsWith('2 ') && rawLines[i + 1].length >= 60) {
            let name = '';
            
            // Recherche du nom (Ligne 0) dans les lignes précédentes non vides
            let searchIdx = i - 1;
            while (searchIdx >= 0 && rawLines[searchIdx].length === 0) {
              searchIdx--;
            }

            if (searchIdx >= 0) {
              const prevLine = rawLines[searchIdx];
              if (!prevLine.startsWith('1 ') && !prevLine.startsWith('2 ')) {
                name = prevLine;
                if (name.startsWith('0 ')) {
                  name = name.substring(2).trim();
                }
              }
            }

            const line1 = line;
            const line2 = rawLines[i + 1];
            const noradId = line1.substring(2, 7).trim();

            if (!name) {
              name = `SAT-${noradId}`;
            }

            sats.push(parseSingleTLE(name, noradId, line1, line2));
            i += 2; // Saut de la ligne 1 et ligne 2
            continue;
          }
        }
        i++;
      }
      return sats;
    }

    async function getLocalTleContent() {
      if (localTleCache !== null) return localTleCache;

      const pathsToTry = [
        './tle/alltle.txt',
        'tle/alltle.txt',
        'alltle.txt'
      ];

      for (const path of pathsToTry) {
        try {
          const response = await fetchWithTimeout(path, {}, 2000);
          if (response.ok) {
            const text = await response.text();
            if (text && text.trim().length > 0) {
              localTleCache = text;
              return localTleCache;
            }
          }
        } catch (err) {
          // Échec de lecture silencieux pour tester le chemin suivant
        }
      }
      return null;
    }

    async function fetchTLEFromLocalFile(noradId) {
      const targetNum = parseInt(noradId, 10);
      if (isNaN(targetNum)) return null;

      const text = await getLocalTleContent();
      if (!text) return null;

      const sats = parseTLEText(text);
      return sats.find(s => parseInt(s.NORAD_CAT_ID, 10) === targetNum) || null;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 2500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    async function fetchTLEByNorad(noradId) {
      const cleanId = String(noradId).trim();
      if (!cleanId) return null;

      // 1. API Ivan Stanojevic (Supporte CORS nativement et rapide)
      try {
        const res = await fetchWithTimeout(`https://tle.ivanstanojevic.me/api/tle/${cleanId}`, {}, 2500);
        if (res.ok) {
          const data = await res.json();
          if (data.line1 && data.line2) {
            return parseSingleTLE(data.name || `SAT-${cleanId}`, cleanId, data.line1, data.line2);
          }
        }
      } catch (err) {
        console.warn(`[API Ivan Stanojevic] NORAD #${cleanId} non disponible/timeout`);
      }

      // 2. Proxy AllOrigins -> Celestrak TLE
      try {
        const celestrakUrl = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${cleanId}&FORMAT=TLE`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(celestrakUrl)}`;
        const res = await fetchWithTimeout(proxyUrl, {}, 3000);
        if (res.ok) {
          const text = await res.text();
          const parsed = parseTLEText(text);
          if (parsed.length > 0) return parsed[0];
        }
      } catch (err) {
        console.warn(`[Celestrak Proxy] NORAD #${cleanId} non disponible/timeout`);
      }

      // 3. Celestrak Direct JSON API
      try {
        const celestrakJsonUrl = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${cleanId}&FORMAT=json`;
        const res = await fetchWithTimeout(celestrakJsonUrl, {}, 2500);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0 && data[0].TLE_LINE1 && data[0].TLE_LINE2) {
            const item = data[0];
            return parseSingleTLE(
              item.OBJECT_NAME || `SAT-${cleanId}`,
              cleanId,
              item.TLE_LINE1,
              item.TLE_LINE2
            );
          }
        }
      } catch (err) {
        console.warn(`[Celestrak JSON] NORAD #${cleanId} non disponible/timeout`);
      }

      // 4. Repli immédiat sur le fichier local ./tle/alltle.txt
      return await fetchTLEFromLocalFile(cleanId);
    }

    function renderCategoryDropdown(selectId = null) {
      catSelect.innerHTML = '';

      // En mode local, on offre aussi l'option d'afficher l'intégralité du fichier
      if (currentMode === 'local') {
        const optAll = document.createElement('option');
        optAll.value = 'all_local';
        optAll.textContent = '--- Tous les satellites du fichier local ---';
        catSelect.appendChild(optAll);
      }

      CODE_PRESET_FAMILIES.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = cat.name;
        catSelect.appendChild(opt);
      });

      if (selectId && Array.from(catSelect.options).some(o => o.value === selectId)) {
        catSelect.value = selectId;
      }

      if (catSelect.options.length > 0) {
        loadSelectedCategory(catSelect.value);
      }
    }

    async function loadSelectedCategory(catId) {
      satSearch.value = "";

      if (currentMode === 'online') {
        // --- MODE ONLINE (via API) ---
        statusEl.textContent = "Téléchargement des TLEs en ligne...";
        satSelect.innerHTML = "<option value=''>Récupération via API...</option>";
        satCount.textContent = "0 objet";

        const preset = CODE_PRESET_FAMILIES.find(c => c.id === catId);
        const noradIds = preset ? preset.noradIds : [];

        if (noradIds.length === 0) {
          statusEl.textContent = "Aucun ID NORAD dans cette famille";
          currentSatellites = [];
          filteredSatellites = [];
          renderSatelliteOptions([]);
          return;
        }

        const results = await Promise.all(noradIds.map(id => fetchTLEByNorad(id)));
        const fetched = results.filter(sat => sat !== null);

        currentSatellites = fetched;
        filteredSatellites = fetched;
        renderSatelliteOptions(filteredSatellites);

        if (fetched.length > 0) {
          statusEl.textContent = `${fetched.length}/${noradIds.length} TLE(s) chargée(s) via API (ONLINE)`;
          selectSatellite(0);
        } else {
          statusEl.textContent = "Échec API en ligne. Basculez en mode LOCAL si nécessaire.";
        }
      } else {
        // --- MODE LOCAL (lecture ./tle/alltle.txt) ---
        statusEl.textContent = "Chargement depuis le fichier local ./tle/alltle.txt...";
        satSelect.innerHTML = "<option value=''>Lecture du fichier TLE local...</option>";
        satCount.textContent = "0 objet";

        const text = await getLocalTleContent();
        if (!text) {
          statusEl.textContent = "Fichier local introuvable. Utilisez 'Charger .txt'.";
          satSelect.innerHTML = "<option value=''>Fichier local inaccessible</option>";
          currentSatellites = [];
          filteredSatellites = [];
          return;
        }

        const allParsed = parseTLEText(text);

        if (catId === 'all_local') {
          currentSatellites = allParsed;
        } else {
          const preset = CODE_PRESET_FAMILIES.find(c => c.id === catId);
          const targetIds = new Set((preset ? preset.noradIds : []).map(id => String(parseInt(id, 10))));
          currentSatellites = allParsed.filter(s => targetIds.has(String(parseInt(s.NORAD_CAT_ID, 10))));
        }

        filteredSatellites = currentSatellites;
        renderSatelliteOptions(filteredSatellites);

        if (filteredSatellites.length > 0) {
          statusEl.textContent = `${filteredSatellites.length} satellite(s) filtré(s) depuis le fichier local`;
          selectSatellite(0);
        } else {
          statusEl.textContent = "Aucun satellite correspondant trouvé dans le fichier local.";
        }
      }
    }

    async function quickFetchNorad(noradId) {
      const cleanId = String(noradId).trim();
      if (!cleanId) return;

      if (currentMode === 'online') {
        // Recherche Rapide via API
        statusEl.textContent = `Recherche API du NORAD #${cleanId}...`;
        const sat = await fetchTLEByNorad(cleanId);

        if (sat) {
          currentSatellites = [sat];
          filteredSatellites = [sat];
          renderSatelliteOptions(filteredSatellites);
          selectSatellite(0);
          statusEl.textContent = `NORAD #${cleanId} trouvé via API (${sat.OBJECT_NAME})`;
        } else {
          statusEl.textContent = `NORAD #${cleanId} introuvable en ligne`;
        }
      } else {
        // Recherche Rapide via Fichier Local
        statusEl.textContent = `Recherche dans le fichier local du NORAD #${cleanId}...`;
        const sat = await fetchTLEFromLocalFile(cleanId);

        if (sat) {
          currentSatellites = [sat];
          filteredSatellites = [sat];
          renderSatelliteOptions(filteredSatellites);
          selectSatellite(0);
          statusEl.textContent = `NORAD #${cleanId} trouvé dans le fichier local (${sat.OBJECT_NAME})`;
        } else {
          statusEl.textContent = `NORAD #${cleanId} introuvable dans le fichier local`;
        }
      }
    }

    function renderSatelliteOptions(satellites) {
      satSelect.innerHTML = '';
      satCount.textContent = `${satellites.length} objet(s)`;

      if (satellites.length === 0) {
        satSelect.innerHTML = '<option value="">Aucun satellite disponible</option>';
        return;
      }

      const MAX_RENDER = 500;
      const listToRender = satellites.slice(0, MAX_RENDER);

      listToRender.forEach((sat, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${sat.OBJECT_NAME} (#${sat.NORAD_CAT_ID})`;
        satSelect.appendChild(opt);
      });

      if (satellites.length > MAX_RENDER) {
        const opt = document.createElement('option');
        opt.disabled = true;
        opt.textContent = `... et ${satellites.length - MAX_RENDER} autres (affinez la recherche)`;
        satSelect.appendChild(opt);
      }
    }

    function selectSatellite(index) {
      if (index === "" || index < 0 || index >= filteredSatellites.length) return;
      const sat = filteredSatellites[index];
      
      selectedSatName = sat.OBJECT_NAME;
      selectedNoradId = sat.NORAD_CAT_ID;
      selectedEpoch = sat.EPOCH;
      selectedLine1 = sat.line1;
      selectedLine2 = sat.line2;

      try {
        selectedSatrec = satellite.twoline2satrec(sat.line1, sat.line2);
        satInfoDiv.classList.remove('hidden');
        drawOrbit(selectedSatrec);
        updatePosition(true);
      } catch (err) {
        console.error("Erreur d'initialisation SGP4", err);
        statusEl.textContent = "Erreur de calcul TLE";
      }
    }

    function calculatePosition(satrec, date) {
      if (!satrec) return null;
      const positionAndVelocity = satellite.propagate(satrec, date);
      const positionEci = positionAndVelocity.position;
      const velocityEci = positionAndVelocity.velocity;

      if (!positionEci || typeof positionEci.x !== 'number') return null;

      const gmst = satellite.gstime(date);
      const positionGd = satellite.eciToGeodetic(positionEci, gmst);

      const lat = satellite.radiansToDegrees(positionGd.latitude);
      let lng = satellite.radiansToDegrees(positionGd.longitude);
      const alt = positionGd.height;

      while (lng > 180) lng -= 360;
      while (lng < -180) lng += 360;

      let speed = 0;
      if (velocityEci && typeof velocityEci.x === 'number') {
        speed = Math.sqrt(velocityEci.x ** 2 + velocityEci.y ** 2 + velocityEci.z ** 2);
      }

      return { lat, lng, alt, speed, positionEci };
    }

    function drawOrbit(satrec) {
      orbitLines.forEach(line => map.removeLayer(line));
      orbitLines = [];

      if (!satrec) return;

      const now = new Date();
      const minOffset = -25; // 25 minutes dans le passé
      const maxOffset = 125;  // 125 minutes dans le futur

      // Calcul des positions minute par minute
      const points = [];
      for (let i = minOffset; i <= maxOffset; i += 1) {
        const time = new Date(now.getTime() + i * 60 * 1000);
        const pos = calculatePosition(satrec, time);
        if (pos) {
          points.push({ lat: pos.lat, lng: pos.lng, step: i });
        }
      }

      // Tracé sous-segment par sous-segment avec opacité progressive
      for (let k = 0; k < points.length - 1; k++) {
        const p1 = points[k];
        const p2 = points[k + 1];

        // Éviter le saut visuel lors de la traversée de l'anti-méridien (180°)
        if (Math.abs(p2.lng - p1.lng) > 180) continue;

        // Normalisation de [-90, +90] vers [0, 1]
        const ratio = (p1.step - minOffset) / (maxOffset - minOffset);
        
        // Progression continue : -90 min -> 0.15 | 0 min -> 0.55 | +90 min -> 0.95
        const opacity = 0.15 + ratio * 0.9;

        const isFuture = p1.step >= 0;
        const color = isFuture ? '#06b6d4' : '#38bdf8';

        const polyline = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], {
          color: color,
          weight: 2,
          opacity: opacity,
          dashArray: '4, 4' // Lignes maintenues en pointillés sur toute l'orbite
        }).addTo(map);

        orbitLines.push(polyline);
      }
    }

    function updatePosition(recenter = false) {
      if (!selectedSatrec) return;

      const now = new Date();
      const pos = calculatePosition(selectedSatrec, now);

      if (!pos) {
        statusEl.textContent = "Position indéterminée";
        return;
      }

      document.getElementById('info-lat').textContent = `${pos.lat.toFixed(4)}°`;
      document.getElementById('info-lng').textContent = `${pos.lng.toFixed(4)}°`;
      document.getElementById('info-alt').textContent = `${Math.round(pos.alt)} km`;
      document.getElementById('info-vel').textContent = `${pos.speed.toFixed(2)} km/s`;
      
      if (selectedSatrec && typeof selectedSatrec.inclo === 'number') {
        const incDeg = (selectedSatrec.inclo * (180 / Math.PI)).toFixed(2);
        document.getElementById('info-inc').textContent = `${incDeg}°`;
      }

      const eclipse = getEclipseState(pos.positionEci, now);
      const eclipseEl = document.getElementById('info-eclipse');
      if (eclipseEl) {
        eclipseEl.className = `font-mono text-[11px] font-bold px-2.5 py-0.5 rounded-full border flex items-center gap-1.5 transition-colors duration-300 ${eclipse.colorClass}`;
        eclipseEl.innerHTML = `<i class="fa-solid ${eclipse.icon} text-[10px]"></i> ${eclipse.label}`;
      }

      document.getElementById('info-epoch').textContent = selectedEpoch;
      document.getElementById('info-current-epoch').textContent = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
      document.getElementById('info-tle').textContent = `${selectedLine1}\n${selectedLine2}`;

      const latLng = [pos.lat, pos.lng];

      if (!marker) {
        marker = L.marker(latLng, { icon: satIcon }).addTo(map);
      } else {
        marker.setLatLng(latLng);
      }

      if (recenter) {
        map.setView(latLng, map.getZoom());
      }
    }

    modeSelect.addEventListener('change', (e) => {
      currentMode = e.target.value;
      renderCategoryDropdown();
    });

    catSelect.addEventListener('change', (e) => loadSelectedCategory(e.target.value));

    satSearch.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      filteredSatellites = currentSatellites.filter(s => 
        s.OBJECT_NAME.toLowerCase().includes(query) || s.NORAD_CAT_ID.toLowerCase().includes(query)
      );
      renderSatelliteOptions(filteredSatellites);
      if (filteredSatellites.length > 0) selectSatellite(0);
    });

    satSelect.addEventListener('change', (e) => selectSatellite(parseInt(e.target.value, 10)));

    btnQuickFetch.addEventListener('click', () => quickFetchNorad(quickNoradInput.value));
    quickNoradInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') quickFetchNorad(quickNoradInput.value);
    });

    btnRecenter.addEventListener('click', () => {
      if (marker) map.setView(marker.getLatLng(), 4);
      else map.setView([0, 0], 2);
    });

    btnRecenterMap.addEventListener('click', () => {
      map.setView([0, 0], 2);
    });

    toggleGrid.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!graticuleLayer) graticuleLayer = createGraticuleLayer();
        map.addLayer(graticuleLayer);
      } else {
        if (graticuleLayer) map.removeLayer(graticuleLayer);
      }
    });

	toggleNight.addEventListener('change', updateNightMask);

    // Initialisation au chargement de la page
    window.addEventListener('load', () => {
      if (localFileInput) {
        localFileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            localTleCache = evt.target.result;
            statusEl.textContent = `Fichier TLE chargé (${file.name})`;
            loadSelectedCategory(catSelect.value);
          };
          reader.readAsText(file);
        });
      }

      renderCategoryDropdown();
	  
	  if (toggleGrid && toggleGrid.checked) {
        graticuleLayer = createGraticuleLayer();
        map.addLayer(graticuleLayer);
      }

      updateNightMask();
      setInterval(() => {
        updatePosition(false);
        updateNightMask();
      }, 1000);
    });
  </script>
