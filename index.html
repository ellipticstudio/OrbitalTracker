<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Orbital 2D - CelesTrak</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Satellite.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #0f172a; color: white; }
    #controls { 
      position: absolute; top: 10px; left: 50px; z-index: 1000; 
      background: rgba(30, 41, 59, 0.95); padding: 14px; border-radius: 8px; 
      border: 1px solid #334155; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    select { background: #0f172a; color: white; padding: 6px 12px; border-radius: 4px; border: 1px solid #475569; font-size: 14px; }
    #status { font-size: 12px; color: #38bdf8; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="controls">
    <div>
      <label for="cat-select">Catégorie : </label>
      <select id="cat-select">
        <option value="stations">Stations Spatiales</option>
        <option value="weather">Satellites Météo</option>
        <option value="starlink">Starlink (Extrait)</option>
        <option value="active">Satellites Actifs (Général)</option>
      </select>
    </div>

    <div>
      <label for="sat-select">Satellite : </label>
      <select id="sat-select"><option>Chargement...</option></select>
    </div>

    <div id="status">Chargement TLE...</div>
  </div>

  <div id="map"></div>

  <script>
    // Configuration des catégories de CelesTrak
    const categories = {
      stations: "https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle",
      weather: "https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=tle",
      starlink: "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle",
      active: "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle"
    };

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap | Données TLE : CelesTrak'
    }).addTo(map);

    let currentSatellites = [];
    let selectedSatrec = null;
    let selectedSatName = "";
    let marker = null;
    let orbitLines = [];

    const catSelect = document.getElementById('cat-select');
    const satSelect = document.getElementById('sat-select');
    const statusEl = document.getElementById('status');

    // Parser le fichier texte TLE brut
    function parseTLE(tleText) {
      const lines = tleText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const result = [];
      
      for (let i = 0; i < lines.length; i += 3) {
        if (lines[i] && lines[i+1] && lines[i+2] && lines[i+1].startsWith('1') && lines[i+2].startsWith('2')) {
          result.push({
            name: lines[i],
            line1: lines[i+1],
            line2: lines[i+2]
          });
        }
      }
      return result;
    }

    // Charger les TLE en ligne depuis CelesTrak avec plusieurs proxys en secours (fallback)
    async function loadCategory(catKey) {
      statusEl.textContent = "Téléchargement TLE...";
      satSelect.innerHTML = "<option>Chargement...</option>";
      
      const targetUrl = categories[catKey];
      
      // Liste de proxys CORS à tester en séquence
      const proxies = [
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      let tleText = null;

      for (const getProxyUrl of proxies) {
        try {
          const proxyUrl = getProxyUrl(targetUrl);
          const response = await fetch(proxyUrl);
          if (response.ok) {
            tleText = await response.text();
            if (tleText && tleText.includes('1 ') && tleText.includes('2 ')) {
              break; // Succès, on sort de la boucle
            }
          }
        } catch (e) {
          console.warn("Échec proxy, tentative suivante...");
        }
      }

      if (!tleText) {
        statusEl.textContent = "Erreur de chargement TLE (Proxys indisponibles)";
        console.error("Impossible de récupérer les données TLE.");
        return;
      }

      // Limiter à 200 satellites par catégorie pour préserver les performances
      currentSatellites = parseTLE(tleText).slice(0, 200);

      satSelect.innerHTML = "";
      currentSatellites.forEach((sat, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = sat.name;
        satSelect.appendChild(opt);
      });

      statusEl.textContent = `${currentSatellites.length} satellites chargés`;
      selectSatellite(0);
    }

    function selectSatellite(index) {
      if (!currentSatellites[index]) return;
      const sat = currentSatellites[index];
      selectedSatName = sat.name;
      selectedSatrec = satellite.twoline2satrec(sat.line1, sat.line2);
      drawOrbit();
      updatePosition();
    }

    function getLatLngAt(satrec, date) {
      const positionAndVelocity = satellite.propagate(satrec, date);
      if (!positionAndVelocity.position) return null;
      const gmst = satellite.gstime(date);
      const positionGd = satellite.eciToGeodetic(positionAndVelocity.position, gmst);
      return {
        lat: satellite.degreesLat(positionGd.latitude),
        lng: satellite.degreesLong(positionGd.longitude)
      };
    }

    function drawOrbit() {
      orbitLines.forEach(line => map.removeLayer(line));
      orbitLines = [];
      if (!selectedSatrec) return;

      const now = new Date();
      let segments = [];
      let currentSegment = [];

      for (let i = 0; i <= 90; i++) {
        const futureTime = new Date(now.getTime() + i * 60 * 1000);
        const pos = getLatLngAt(selectedSatrec, futureTime);

        if (pos) {
          if (currentSegment.length > 0) {
            const prevLng = currentSegment[currentSegment.length - 1][1];
            if (Math.abs(pos.lng - prevLng) > 180) {
              segments.push(currentSegment);
              currentSegment = [];
            }
          }
          currentSegment.push([pos.lat, pos.lng]);
        }
      }
      if (currentSegment.length > 0) segments.push(currentSegment);

      segments.forEach(segment => {
        const polyline = L.polyline(segment, { color: '#38bdf8', weight: 2, dashArray: '4, 4' }).addTo(map);
        orbitLines.push(polyline);
      });
    }

    function updatePosition() {
      if (!selectedSatrec) return;
      const pos = getLatLngAt(selectedSatrec, new Date());

      if (pos) {
        if (!marker) {
          marker = L.marker([pos.lat, pos.lng]).addTo(map);
        } else {
          marker.setLatLng([pos.lat, pos.lng]);
        }
        marker.bindPopup(`<b>${selectedSatName}</b>`);
      }
    }

    // Événements
    catSelect.addEventListener('change', (e) => loadCategory(e.target.value));
    satSelect.addEventListener('change', (e) => selectSatellite(e.target.value));

    // Initialisation
    loadCategory('stations');

    // Intervalle réglé à 1000 ms (1 seconde)
    setInterval(updatePosition, 1000);
  </script>
</body>
</html>
