<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Orbital 2D - CelesTrak Direct</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #0f172a; color: white; }
    #controls { 
      position: absolute; top: 10px; left: 50px; z-index: 1000; 
      background: rgba(30, 41, 59, 0.95); padding: 14px; border-radius: 8px; 
      border: 1px solid #334155; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    select { background: #0f172a; color: white; padding: 6px 12px; border-radius: 4px; border: 1px solid #475569; font-size: 14px; }
    #status { font-size: 12px; color: #38bdf8; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="controls">
    <div>
      <label for="cat-select">Catégorie : </label>
      <select id="cat-select">
        <option value="stations">Stations Spatiales</option>
        <option value="weather">Satellites Météo</option>
        <option value="starlink">Starlink (Extrait)</option>
        <option value="active">Satellites Actifs (Général)</option>
      </select>
    </div>

    <div>
      <label for="sat-select">Satellite : </label>
      <select id="sat-select"><option>Chargement...</option></select>
    </div>

    <div id="status">Chargement TLE...</div>
  </div>

  <div id="map"></div>

  <script>
    // Endpoints JSON natifs de CelesTrak (CORS activé par défaut)
    const categories = {
      stations: "https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json",
      weather: "https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=json",
      starlink: "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=json",
      active: "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json"
    };

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap | CelesTrak'
    }).addTo(map);

    let currentSatellites = [];
    let selectedSatrec = null;
    let selectedSatName = "";
    let marker = null;
    let orbitLines = [];

    const catSelect = document.getElementById('cat-select');
    const satSelect = document.getElementById('sat-select');
    const statusEl = document.getElementById('status');

    // Charger directement les données GP (General Perturbations) en JSON
    async function loadCategory(catKey) {
      statusEl.textContent = "Téléchargement CelesTrak Direct...";
      satSelect.innerHTML = "<option>Chargement...</option>";
      
      const targetUrl = categories[catKey];

      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("Erreur réseau HTTP " + response.status);
        
        const data = await response.json();
        
        // Limiter à 200 satellites pour conserver une bonne fluidité d'affichage
        currentSatellites = data.slice(0, 200);

        satSelect.innerHTML = "";
        currentSatellites.forEach((sat, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = sat.OBJECT_NAME;
          satSelect.appendChild(opt);
        });

        statusEl.textContent = `${currentSatellites.length} satellites chargés`;
        selectSatellite(0);
      } catch (err) {
        console.error("Erreur de récupération :", err);
        statusEl.textContent = "Erreur d'accès à CelesTrak";
      }
    }

    function selectSatellite(index) {
      if (!currentSatellites[index]) return;
      const sat = currentSatellites[index];
      selectedSatName = sat.OBJECT_NAME;
      
      // satellite.js supporte la création directe depuis l'objet JSON CelesTrak (OMM / GP data)
      selectedSatrec = satellite.jsonToSatrec(sat);
      
      drawOrbit();
      updatePosition();
    }

    function getLatLngAt(satrec, date) {
      const positionAndVelocity = satellite.propagate(satrec, date);
      if (!positionAndVelocity.position) return null;
      const gmst = satellite.gstime(date);
      const positionGd = satellite.eciToGeodetic(positionAndVelocity.position, gmst);
      return {
        lat: satellite.degreesLat(positionGd.latitude),
        lng: satellite.degreesLong(positionGd.longitude)
      };
    }

    function drawOrbit() {
      orbitLines.forEach(line => map.removeLayer(line));
      orbitLines = [];
      if (!selectedSatrec) return;

      const now = new Date();
      let segments = [];
      let currentSegment = [];

      for (let i = 0; i <= 90; i++) {
        const futureTime = new Date(now.getTime() + i * 60 * 1000);
        const pos = getLatLngAt(selectedSatrec, futureTime);

        if (pos) {
          if (currentSegment.length > 0) {
            const prevLng = currentSegment[currentSegment.length - 1][1];
            if (Math.abs(pos.lng - prevLng) > 180) {
              segments.push(currentSegment);
              currentSegment = [];
            }
          }
          currentSegment.push([pos.lat, pos.lng]);
        }
      }
      if (currentSegment.length > 0) segments.push(currentSegment);

      segments.forEach(segment => {
        const polyline = L.polyline(segment, { color: '#38bdf8', weight: 2, dashArray: '4, 4' }).addTo(map);
        orbitLines.push(polyline);
      });
    }

    function updatePosition() {
      if (!selectedSatrec) return;
      const pos = getLatLngAt(selectedSatrec, new Date());

      if (pos) {
        if (!marker) {
          marker = L.marker([pos.lat, pos.lng]).addTo(map);
        } else {
          marker.setLatLng([pos.lat, pos.lng]);
        }
        marker.bindPopup(`<b>${selectedSatName}</b>`);
      }
    }

    catSelect.addEventListener('change', (e) => loadCategory(e.target.value));
    satSelect.addEventListener('change', (e) => selectSatellite(e.target.value));

    // Lancement
    loadCategory('stations');
    setInterval(updatePosition, 1000);
  </script>
</body>
</html>
