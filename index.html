<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbitalTracker 2D - Suivi Satellite en Temps Réel (CelesTrak)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Satellite.js pour le calcul orbital SGP4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      background-color: #080c14; 
    }

    #map { 
      width: 100vw; 
      height: 100vh; 
      background-color: #080c14; 
    }
    
    /* Style sur-mesure pour les infobulles Leaflet */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      border-radius: 12px !important;
    }

    .leaflet-container { 
      background: #080c14 !important; 
    }

    /* Animation d'onde d'impulsion pour le satellite */
    @keyframes radar-pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.6); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .pulse-ring {
      animation: radar-pulse 2s infinite ease-in-out;
    }

    /* Personnalisation des barres de défilement */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Panneau de Contrôle Principal -->
  <div class="absolute top-4 left-4 z-[1000] w-80 md:w-96 bg-slate-900/95 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-2xl transition-all duration-300 max-h-[92vh] flex flex-col justify-between overflow-y-auto">
    
    <div>
      <!-- En-tête -->
      <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-sky-500/20 border border-sky-500/30 flex items-center justify-center text-sky-400 shadow-inner">
            <i class="fa-solid fa-satellite text-lg"></i>
          </div>
          <div>
            <h1 class="font-bold text-sm uppercase tracking-wider text-slate-100">OrbitalTracker 2D</h1>
            <p class="text-[10px] text-sky-400 font-mono flex items-center gap-1">
              <i class="fa-solid fa-earth-americas text-[9px]"></i> Source : CelesTrak Direct API
            </p>
          </div>
        </div>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> CORS OK
        </span>
      </div>

      <!-- Sélecteur de Catégorie Satellitaire -->
      <div class="space-y-3">
        <div>
          <label for="cat-select" class="block text-xs font-semibold text-slate-300 mb-1">
            <i class="fa-solid fa-layer-group mr-1 text-sky-400"></i> Catégorie de Satellites
          </label>
          <select id="cat-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition shadow-inner">
            <option value="stations">Stations Spatiales (ISS, Tiangong...)</option>
            <option value="weather">Satellites Météo (NOAA, GOES, MetOp...)</option>
            <option value="starlink">Starlink (Constellation SpaceX)</option>
            <option value="gps-ops">Navigation GPS / Galileo / GLONASS</option>
            <option value="science">Observatoires Scientifiques (Hubble, JWST...)</option>
            <option value="active">Flotte Globale Active</option>
          </select>
        </div>

        <!-- Recherche & Filtre de Satellites -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="sat-search" class="block text-xs font-semibold text-slate-300">
              <i class="fa-solid fa-magnifying-glass mr-1 text-sky-400"></i> Choisir un Satellite
            </label>
            <span id="sat-count" class="text-[10px] text-slate-400 font-mono">0 objet</span>
          </div>
          
          <input type="text" id="sat-search" placeholder="Filtrer par nom ou ID NORAD..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 mb-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition font-mono placeholder:text-slate-600">

          <select id="sat-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500 transition shadow-inner">
            <option value="">Chargement de la liste...</option>
          </select>
        </div>
      </div>

      <!-- Télémétrie en Direct -->
      <div id="sat-info" class="mt-4 pt-3 border-t border-slate-800/80 text-xs space-y-2 hidden">
        <div class="flex justify-between items-center bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
          <span class="text-slate-400">Identifiant NORAD :</span>
          <span id="info-norad" class="font-mono text-slate-200 font-bold">#00000</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
            <span class="text-[10px] text-slate-400 block mb-0.5">Latitude</span>
            <span id="info-lat" class="font-mono text-sky-400 font-bold text-xs">0.0000°</span>
          </div>
          <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
            <span class="text-[10px] text-slate-400 block mb-0.5">Longitude</span>
            <span id="info-lng" class="font-mono text-sky-400 font-bold text-xs">0.0000°</span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
            <span class="text-[10px] text-slate-400 block mb-0.5">Altitude</span>
            <span id="info-alt" class="font-mono text-emerald-400 font-bold text-xs">0 km</span>
          </div>
          <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-800/50">
            <span class="text-[10px] text-slate-400 block mb-0.5">Vitesse Orbitale</span>
            <span id="info-vel" class="font-mono text-purple-400 font-bold text-xs">0 km/s</span>
          </div>
        </div>
        <div class="flex justify-between items-center text-[10px] text-slate-400 px-1 pt-1">
          <span>Date Époque TLE :</span>
          <span id="info-epoch" class="font-mono text-amber-400">---</span>
        </div>

        <!-- Action rapides -->
        <div class="pt-2 flex gap-2">
          <button id="btn-recenter" class="flex-1 py-1.5 px-2 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white rounded-lg text-[11px] font-medium transition flex items-center justify-center gap-1.5 shadow">
            <i class="fa-solid fa-crosshairs text-[10px]"></i> Centrer la vue
          </button>
        </div>
      </div>
    </div>

    <!-- Status Footer -->
    <div class="mt-4 text-[11px] text-slate-400 flex items-center justify-between border-t border-slate-800/80 pt-2.5">
      <span id="status-text" class="truncate pr-2">Connexion à CelesTrak...</span>
      <span class="text-sky-400 flex items-center gap-1 font-mono text-[10px] shrink-0">
        <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span> SGP4 Active
      </span>
    </div>
  </div>

  <!-- Carte Leaflet Fullscreen -->
  <div id="map"></div>

  <script>
    // Endpoints CelesTrak Direct (API publique avec support CORS native)
    const CELESTRAK_ENDPOINTS = {
      stations: "https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json",
      weather: "https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=json",
      starlink: "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=json",
      "gps-ops": "https://celestrak.org/NORAD/elements/gp.php?GROUP=gps-ops&FORMAT=json",
      science: "https://celestrak.org/NORAD/elements/gp.php?GROUP=science&FORMAT=json",
      active: "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json"
    };

    // Initialisation de la carte Leaflet
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2.5,
      zoomControl: false
    });

    // Ajustement de la taille de la carte sur redimensionnement
    setTimeout(() => map.invalidateSize(), 200);
    window.addEventListener('resize', () => map.invalidateSize());

    // Contrôle de zoom en bas à droite
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Fonds de carte ESRI sans clé API
    const darkMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxZoom: 16
    }).addTo(map);

    const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    L.control.layers({
      "Mode Sombre": darkMap,
      "Vue Satellite": satelliteMap
    }, null, { position: 'topright' }).addTo(map);

    // Icône personnalisée pour le satellite avec animation radar
    const satIcon = L.divIcon({
      className: 'custom-sat-icon',
      html: `
        <div class="relative flex items-center justify-center">
          <span class="pulse-ring absolute inline-flex h-8 w-8 rounded-full bg-sky-400 opacity-50"></span>
          <div class="w-7 h-7 bg-slate-900 border-2 border-sky-400 rounded-full flex items-center justify-center text-sky-400 shadow-xl shadow-sky-500/50 relative z-10">
            <i class="fa-solid fa-satellite text-[11px]"></i>
          </div>
        </div>
      `,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    // Variables d'état global
    let currentSatellites = [];
    let filteredSatellites = [];
    let selectedSatrec = null;
    let selectedSatName = "";
    let selectedNoradId = "";
    let selectedEpoch = "";
    let marker = null;
    let orbitLines = [];

    // Éléments du DOM
    const catSelect = document.getElementById('cat-select');
    const satSearch = document.getElementById('sat-search');
    const satSelect = document.getElementById('sat-select');
    const satCount = document.getElementById('sat-count');
    const statusEl = document.getElementById('status-text');
    const satInfoDiv = document.getElementById('sat-info');
    const btnRecenter = document.getElementById('btn-recenter');

    // Chargement des données GP/TLE depuis CelesTrak Direct
    async function loadCategoryData(catKey) {
      statusEl.textContent = "Téléchargement direct depuis CelesTrak...";
      satSelect.innerHTML = "<option value=''>Chargement des données...</option>";
      satCount.textContent = "0 objet";
      satSearch.value = "";

      const url = CELESTRAK_ENDPOINTS[catKey] || CELESTRAK_ENDPOINTS.stations;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Erreur réseau HTTP ${response.status}`);
        }

        const data = await response.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("Aucun satellite trouvé dans la réponse");
        }

        currentSatellites = data;
        filteredSatellites = data;
        
        renderSatelliteOptions(filteredSatellites);
        statusEl.textContent = `${data.length} satellites reçus via CelesTrak`;
        
        // Sélection par défaut du premier satellite
        selectSatellite(0);
      } catch (err) {
        console.error("Erreur CelesTrak :", err);
        satSelect.innerHTML = "<option value=''>Erreur de chargement</option>";
        statusEl.textContent = "Échec du téléchargement CelesTrak";
      }
    }

    // Rendu des options de sélection de satellite avec filtre
    function renderSatelliteOptions(satList) {
      satSelect.innerHTML = "";
      satCount.textContent = `${satList.length} objet${satList.length > 1 ? 's' : ''}`;

      if (satList.length === 0) {
        satSelect.innerHTML = "<option value=''>Aucun résultat trouvé</option>";
        return;
      }

      satList.forEach((sat, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const name = sat.OBJECT_NAME || sat.SATNAME || "Objet Inconnu";
        const norad = sat.NORAD_CAT_ID || "N/A";
        opt.textContent = `${name} (#${norad})`;
        satSelect.appendChild(opt);
      });
    }

    // Filtrer la liste des satellites par champ de recherche
    satSearch.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        filteredSatellites = currentSatellites;
      } else {
        filteredSatellites = currentSatellites.filter(sat => {
          const name = (sat.OBJECT_NAME || sat.SATNAME || "").toLowerCase();
          const norad = String(sat.NORAD_CAT_ID || "");
          return name.includes(query) || norad.includes(query);
        });
      }
      renderSatelliteOptions(filteredSatellites);
      if (filteredSatellites.length > 0) {
        selectSatellite(0);
      }
    });

    // Sélection d'un satellite spécifique
    function selectSatellite(filterIndex) {
      if (!filteredSatellites[filterIndex]) return;
      const sat = filteredSatellites[filterIndex];

      selectedSatName = sat.OBJECT_NAME || sat.SATNAME || "Satellite Inconnu";
      selectedNoradId = sat.NORAD_CAT_ID || "N/A";
      selectedEpoch = sat.EPOCH || "N/A";

      // Extraction des lignes TLE 1 et 2
      const line1 = sat.TLE_LINE1 || sat.tle1 || sat.LINE1;
      const line2 = sat.TLE_LINE2 || sat.tle2 || sat.LINE2;

      if (line1 && line2) {
        try {
          selectedSatrec = satellite.twoline2satrec(line1.trim(), line2.trim());
        } catch (err) {
          console.error("Erreur de parsing TLE SGP4 :", err);
          selectedSatrec = null;
        }
      } else {
        selectedSatrec = null;
      }

      if (!selectedSatrec) {
        satInfoDiv.classList.add('hidden');
        statusEl.textContent = "Format TLE invalide pour ce satellite";
        return;
      }

      document.getElementById('info-norad').textContent = `#${selectedNoradId}`;
      document.getElementById('info-epoch').textContent = selectedEpoch;

      satInfoDiv.classList.remove('hidden');
      drawOrbit();
      updatePosition(true);
    }

    // Calcul SGP4 sécurisé à une date donnée (évite les valeurs NaN)
    function getSatelliteStateAt(satrec, date) {
      try {
        if (!satrec) return null;
        const positionAndVelocity = satellite.propagate(satrec, date);
        if (!positionAndVelocity || !positionAndVelocity.position || !positionAndVelocity.velocity) return null;

        const pos = positionAndVelocity.position;
        const vel = positionAndVelocity.velocity;

        if (!isFinite(pos.x) || !isFinite(pos.y) || !isFinite(pos.z)) return null;

        const gmst = satellite.gstime(date);
        const positionGd = satellite.eciToGeodetic(pos, gmst);

        const lat = satellite.degreesLat(positionGd.latitude);
        const lng = satellite.degreesLong(positionGd.longitude);
        const alt = positionGd.height;
        const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y + vel.z * vel.z);

        if (!isFinite(lat) || !isFinite(lng) || !isFinite(alt) || isNaN(lat) || isNaN(lng)) {
          return null;
        }

        return { lat, lng, alt, speed };
      } catch (err) {
        return null;
      }
    }

    // Tracer la trajectoire orbitale au sol (90 minutes futures)
    function drawOrbit() {
      // Effacer les anciennes lignes
      orbitLines.forEach(line => map.removeLayer(line));
      orbitLines = [];
      if (!selectedSatrec) return;

      const now = new Date();
      let segments = [];
      let currentSegment = [];

      for (let i = 0; i <= 90; i++) {
        const futureTime = new Date(now.getTime() + i * 60 * 1000);
        const pos = getSatelliteStateAt(selectedSatrec, futureTime);

        if (pos) {
          // Gestion du franchissement du méridien de 180° pour éviter le trait de traversée
          if (currentSegment.length > 0) {
            const prevLng = currentSegment[currentSegment.length - 1][1];
            if (Math.abs(pos.lng - prevLng) > 180) {
              segments.push(currentSegment);
              currentSegment = [];
            }
          }
          currentSegment.push([pos.lat, pos.lng]);
        }
      }
      if (currentSegment.length > 0) segments.push(currentSegment);

      // Dessiner chaque segment sur la carte
      segments.forEach(segment => {
        if (segment.length > 1) {
          const polyline = L.polyline(segment, { 
            color: '#38bdf8', 
            weight: 2, 
            dashArray: '6, 6',
            opacity: 0.85 
          }).addTo(map);
          orbitLines.push(polyline);
        }
      });
    }

    // Mise à jour de la position du satellite en temps réel
    function updatePosition(autoCenter = false) {
      if (!selectedSatrec) return;
      const now = new Date();
      const state = getSatelliteStateAt(selectedSatrec, now);

      if (state) {
        document.getElementById('info-lat').textContent = `${state.lat.toFixed(4)}°`;
        document.getElementById('info-lng').textContent = `${state.lng.toFixed(4)}°`;
        document.getElementById('info-alt').textContent = `${state.alt.toFixed(1)} km`;
        document.getElementById('info-vel').textContent = `${state.speed.toFixed(2)} km/s`;

        if (!marker) {
          marker = L.marker([state.lat, state.lng], { icon: satIcon }).addTo(map);
        } else {
          marker.setLatLng([state.lat, state.lng]);
        }

        if (autoCenter) {
          map.panTo([state.lat, state.lng], { animate: true, duration: 0.8 });
        }

        marker.bindPopup(`
          <div class="p-1 font-sans">
            <h3 class="font-bold text-sky-400 text-sm mb-1">${selectedSatName}</h3>
            <p class="text-xs text-slate-300">NORAD ID : <b>#${selectedNoradId}</b></p>
            <p class="text-xs text-slate-300">Altitude : <b>${state.alt.toFixed(1)} km</b></p>
            <p class="text-xs text-slate-300">Vitesse : <b>${state.speed.toFixed(2)} km/s</b></p>
            <p class="text-[10px] text-slate-400 mt-2 font-mono border-t border-slate-800 pt-1">Propagation SGP4 - Temps Réel</p>
          </div>
        `);
      }
    }

    // Événements d'interaction
    catSelect.addEventListener('change', (e) => loadCategoryData(e.target.value));
    satSelect.addEventListener('change', (e) => selectSatellite(e.target.value));

    btnRecenter.addEventListener('click', () => {
      if (marker) {
        map.panTo(marker.getLatLng(), { animate: true, duration: 0.8 });
      }
    });

    // Lancement au chargement de la page
    window.addEventListener('DOMContentLoaded', () => {
      loadCategoryData('stations');
    });

    // Boucle de mise à jour en temps réel (chaque seconde)
    setInterval(() => updatePosition(false), 1000);
  </script>
</body>
</html>
