<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbitalTracker 2D - Suivi de Flotte Satellite</title>

  <!-- Tailwind CSS pour une interface soignée -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Satellite.js pour les calculs SGP4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>

  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Correction de la hauteur de la carte et du rendu Leaflet */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
    #map { width: 100vw; height: 100vh; background-color: #090d16; }
    
    /* Personnalisation des popups Leaflet en Mode Sombre */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .leaflet-container { background: #0b0f19 !important; }
    
    /* Scrollbar personnalisée pour le menu */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Panneau de Contrôle Flottant -->
  <div class="absolute top-4 left-4 z-[1000] w-80 md:w-96 bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-800 shadow-2xl transition-all duration-300">
    <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-satellite-dish text-sky-400 text-lg"></i>
        <h1 class="font-bold text-sm uppercase tracking-wider text-slate-200">OrbitalTracker 2D</h1>
      </div>
      <span id="source-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
        Chargement...
      </span>
    </div>

    <!-- Sélecteurs -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Catégorie de Flotte</label>
        <select id="cat-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
          <option value="stations">Stations Spatiales (ISS, Tiangong...)</option>
          <option value="weather">Satellites Météo (NOAA, GOES...)</option>
          <option value="starlink">Starlink (Constellation)</option>
          <option value="active">Satellites Scientifiques & GPS</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Satellite Sélectionné</label>
        <select id="sat-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
          <option value="">Chargement de la liste...</option>
        </select>
      </div>
    </div>

    <!-- Informations en temps réel du satellite -->
    <div id="sat-info" class="mt-4 pt-3 border-t border-slate-800 text-xs space-y-2 hidden">
      <div class="flex justify-between items-center">
        <span class="text-slate-400">Latitude :</span>
        <span id="info-lat" class="font-mono text-sky-400 font-bold">0.0000°</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-slate-400">Longitude :</span>
        <span id="info-lng" class="font-mono text-sky-400 font-bold">0.0000°</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-slate-400">Altitude :</span>
        <span id="info-alt" class="font-mono text-emerald-400 font-bold">0 km</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-slate-400">Vitesse :</span>
        <span id="info-vel" class="font-mono text-purple-400 font-bold">0 km/s</span>
      </div>
    </div>

    <!-- Status footer -->
    <div class="mt-3 text-[11px] text-slate-500 flex items-center justify-between">
      <span id="status-text">Initialisation...</span>
      <span class="text-emerald-500 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> SGP4 Live
      </span>
    </div>
  </div>

  <!-- Carte Leaflet Fullscreen -->
  <div id="map"></div>

  <script>
    // Données TLE de secours intégrées localement (permet le fonctionnement instantané sans CORS/Réseau)
    const EMBEDDED_FALLBACK_DATA = {
      stations: [
        {
          OBJECT_NAME: "ISS (ZARYA)",
          TLE_LINE1: "1 25544U 98067A   24080.52843720  .00015523  00000+0  27572-3 0  9993",
          TLE_LINE2: "2 25544  51.6416 288.4239 0004381 122.2514 308.1751 15.49814420445098"
        },
        {
          OBJECT_NAME: "CSS (TIANGONG)",
          TLE_LINE1: "1 48274U 21035A   24080.56023306  .00012831  00000+0  14713-3 0  9994",
          TLE_LINE2: "2 48274  41.4729 181.2587 0006233 227.1824 233.1592 15.60228308167814"
        }
      ],
      weather: [
        {
          OBJECT_NAME: "NOAA 19",
          TLE_LINE1: "1 33591U 09005A   24080.51130752  .00000072  00000+0  63421-4 0  9998",
          TLE_LINE2: "2 33591  98.7042 101.4820 0013821 167.3524 192.8105 14.12467355778811"
        },
        {
          OBJECT_NAME: "METOP-B",
          TLE_LINE1: "1 38771U 12049A   24080.45028020  .00000012  00000+0  24503-4 0  9991",
          TLE_LINE2: "2 38771  98.7073  89.4320 0001235  96.5321 263.6021 14.21482012592031"
        }
      ],
      starlink: [
        {
          OBJECT_NAME: "STARLINK-1007",
          TLE_LINE1: "1 44713U 19074A   24080.40000000  .00001000  00000+0  80000-4 0  9999",
          TLE_LINE2: "2 44713  53.0500 120.1000 0001000  90.0000 270.0000 15.06000000100000"
        },
        {
          OBJECT_NAME: "STARLINK-30121",
          TLE_LINE1: "1 58000U 23150A   24080.50000000  .00001500  00000+0  90000-4 0  9999",
          TLE_LINE2: "2 58000  53.1600 210.3000 0001200  80.0000 280.0000 15.02000000100000"
        }
      ],
      active: [
        {
          OBJECT_NAME: "HUBBLE SPACE TELESCOPE",
          TLE_LINE1: "1 20580U 90037B   24080.41249712  .00001284  00000+0  68912-4 0  9992",
          TLE_LINE2: "2 20580  28.4688 248.8354 0002829  93.7544 266.3683 15.09289131862143"
        },
        {
          OBJECT_NAME: "GPS BIIR-2 (PRN 13)",
          TLE_LINE1: "1 24876U 97035A   24080.35000000 -.00000060  00000+0  00000+0 0  9991",
          TLE_LINE2: "2 24876  55.2000 150.0000 0050000  40.0000 320.0000  2.00560000100000"
        }
      ]
    };

    // URLs des API CelesTrak
    const CELESTRAK_URLS = {
      stations: "https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json",
      weather: "https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=json",
      starlink: "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=json",
      active: "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json"
    };
  </script>

  <script>
    // Initialisation de la carte Leaflet avec la couche sombre CartoDB DarkMatter
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2.5,
      zoomControl: false
    });

    // Invalidation de la taille de la carte pour assurer le bon rendu complet
    setTimeout(() => { map.invalidateSize(); }, 200);
    window.addEventListener('resize', () => map.invalidateSize());

    // Bouton de zoom repositionné
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Tuiles ESRI Dark Gray Canvas (Totalement gratuit et sans clé API)
    const darkTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      maxZoom: 16
    }).addTo(map);

    // Couche ESRI World Imagery (Vue Satellite)
    const satelliteTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP'
    });

    // Sélecteur de fonds de carte (en haut à droite)
    L.control.layers({
      "Carte Sombre": darkTiles,
      "Vue Satellite": satelliteTiles
    }, null, { position: 'topright' }).addTo(map);

    // Icône personnalisée de satellite
    const satIcon = L.divIcon({
      className: 'custom-sat-icon',
      html: `
        <div class="relative flex items-center justify-center">
          <span class="animate-ping absolute inline-flex h-8 w-8 rounded-full bg-sky-400 opacity-40"></span>
          <div class="w-6 h-6 bg-slate-900 border-2 border-sky-400 rounded-full flex items-center justify-center text-sky-400 shadow-lg shadow-sky-500/50">
            <i class="fa-solid fa-satellite text-[10px]"></i>
          </div>
        </div>
      `,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    // Variables d'état
    let currentSatellites = [];
    let selectedSatrec = null;
    let selectedSatName = "";
    let marker = null;
    let orbitLines = [];

    // Références DOM
    const catSelect = document.getElementById('cat-select');
    const satSelect = document.getElementById('sat-select');
    const statusEl = document.getElementById('status-text');
    const sourceBadge = document.getElementById('source-badge');
    const satInfoDiv = document.getElementById('sat-info');

    // Récupération Résiliente Multi-Sources
    async function fetchSatelliteData(catKey) {
      const targetUrl = CELESTRAK_URLS[catKey];
      
      // Essai 1 : Accès Direct CelesTrak
      try {
        const response = await fetch(targetUrl, { cache: 'no-cache' });
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            setSourceBadge('CelesTrak Direct', 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30');
            return data;
          }
        }
      } catch (e) {
        console.warn("Échec requête directe CelesTrak, tentative via Proxys CORS...");
      }

      // Essai 2 : Proxys CORS de secours
      const proxies = [
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];

      for (const proxyGen of proxies) {
        try {
          const proxyUrl = proxyGen(targetUrl);
          const response = await fetch(proxyUrl);
          if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) {
              setSourceBadge('CelesTrak (Proxy)', 'bg-sky-500/20 text-sky-300 border-sky-500/30');
              return data;
            }
          }
        } catch (err) {
          console.warn("Échec proxy CORS, tentative suivante...");
        }
      }

      // Essai 3 : Repli total sur la base TLE embarquée locale
      console.warn("Utilisation de la base de données TLE locale embarquée.");
      setSourceBadge('Mode Hors-Ligne (Local)', 'bg-amber-500/20 text-amber-300 border-amber-500/30');
      return EMBEDDED_FALLBACK_DATA[catKey] || EMBEDDED_FALLBACK_DATA.stations;
    }

    function setSourceBadge(text, classes) {
      sourceBadge.textContent = text;
      sourceBadge.className = `text-[10px] px-2 py-0.5 rounded-full border ${classes}`;
    }

    // Chargement de la catégorie sélectionnée
    async function loadCategory(catKey) {
      statusEl.textContent = "Téléchargement données...";
      satSelect.innerHTML = "<option>Chargement...</option>";
      
      try {
        const data = await fetchSatelliteData(catKey);
        currentSatellites = data.slice(0, 300); // Limite à 300 satellites

        satSelect.innerHTML = "";
        currentSatellites.forEach((sat, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = sat.OBJECT_NAME || sat.name || `Satellite ${idx+1}`;
          satSelect.appendChild(opt);
        });

        statusEl.textContent = `${currentSatellites.length} satellites prêts`;
        selectSatellite(0);
      } catch (err) {
        console.error("Erreur globale :", err);
        statusEl.textContent = "Erreur d'initialisation";
      }
    }

    // Sélection d'un satellite dans la liste
    function selectSatellite(index) {
      if (!currentSatellites[index]) return;
      const sat = currentSatellites[index];
      selectedSatName = sat.OBJECT_NAME || sat.name || sat.NAME || `Satellite ${parseInt(index) + 1}`;

      // Extraire les deux lignes TLE de manière sécurisée quel que soit le format de la propriété
      const line1 = sat.TLE_LINE1 || sat.tle1 || sat.line1 || sat.LINE1;
      const line2 = sat.TLE_LINE2 || sat.tle2 || sat.line2 || sat.LINE2;

      if (line1 && line2) {
        try {
          selectedSatrec = satellite.twoline2satrec(line1.trim(), line2.trim());
        } catch (err) {
          console.error("Erreur de décodage TLE :", err);
          selectedSatrec = null;
        }
      } else {
        console.warn("Données TLE introuvables pour ce satellite :", sat);
        selectedSatrec = null;
      }

      if (!selectedSatrec) {
        satInfoDiv.classList.add('hidden');
        statusEl.textContent = "Données TLE invalides";
        return;
      }

      satInfoDiv.classList.remove('hidden');
      drawOrbit();
      updatePosition(true); // Recentrer la carte sur le satellite sélectionné
    }

    // Calcul SGP4 pour une date donnée avec validation stricte
    function getSatelliteStateAt(satrec, date) {
      try {
        if (!satrec) return null;
        const positionAndVelocity = satellite.propagate(satrec, date);
        if (!positionAndVelocity || !positionAndVelocity.position || !positionAndVelocity.velocity) return null;

        const pos = positionAndVelocity.position;
        const vel = positionAndVelocity.velocity;

        // Vérification de la validité des coordonnées numériques
        if (!isFinite(pos.x) || !isFinite(pos.y) || !isFinite(pos.z)) return null;

        const gmst = satellite.gstime(date);
        const positionGd = satellite.eciToGeodetic(pos, gmst);

        const lat = satellite.degreesLat(positionGd.latitude);
        const lng = satellite.degreesLong(positionGd.longitude);
        const alt = positionGd.height;
        const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y + vel.z * vel.z);

        if (!isFinite(lat) || !isFinite(lng) || !isFinite(alt) || isNaN(lat) || isNaN(lng)) {
          return null;
        }

        return { lat, lng, alt, speed };
      } catch (err) {
        console.error("Erreur SGP4 propagation:", err);
        return null;
      }
    }

    // Tracé de l'orbite au sol (90 minutes futures)
    function drawOrbit() {
      orbitLines.forEach(line => map.removeLayer(line));
      orbitLines = [];
      if (!selectedSatrec) return;

      const now = new Date();
      let segments = [];
      let currentSegment = [];

      for (let i = 0; i <= 90; i++) {
        const futureTime = new Date(now.getTime() + i * 60 * 1000);
        const pos = getSatelliteStateAt(selectedSatrec, futureTime);

        if (pos) {
          if (currentSegment.length > 0) {
            const prevLng = currentSegment[currentSegment.length - 1][1];
            // Anti-meridian wrap prevention (-180 / +180 deg)
            if (Math.abs(pos.lng - prevLng) > 180) {
              segments.push(currentSegment);
              currentSegment = [];
            }
          }
          currentSegment.push([pos.lat, pos.lng]);
        }
      }
      if (currentSegment.length > 0) segments.push(currentSegment);

      // Dessin des segments polynomiaux pointillés
      segments.forEach(segment => {
        if (segment.length > 1) {
          const polyline = L.polyline(segment, { 
            color: '#38bdf8', 
            weight: 2, 
            dashArray: '6, 6',
            opacity: 0.8 
          }).addTo(map);
          orbitLines.push(polyline);
        }
      });
    }

    // Mise à jour de la position courante (1 seconde)
    function updatePosition(autoCenter = false) {
      if (!selectedSatrec) return;
      const now = new Date();
      const state = getSatelliteStateAt(selectedSatrec, now);

      if (state) {
        // Mise à jour de l'affichage du panneau d'information
        document.getElementById('info-lat').textContent = `${state.lat.toFixed(4)}°`;
        document.getElementById('info-lng').textContent = `${state.lng.toFixed(4)}°`;
        document.getElementById('info-alt').textContent = `${state.alt.toFixed(1)} km`;
        document.getElementById('info-vel').textContent = `${state.speed.toFixed(2)} km/s`;

        // Repositionnement du Marker sur la carte
        if (!marker) {
          marker = L.marker([state.lat, state.lng], { icon: satIcon }).addTo(map);
        } else {
          marker.setLatLng([state.lat, state.lng]);
        }

        if (autoCenter) {
          map.panTo([state.lat, state.lng]);
        }

        marker.bindPopup(`
          <div class="p-1">
            <h3 class="font-bold text-sky-400 text-sm mb-1">${selectedSatName}</h3>
            <p class="text-xs text-slate-300">Altitude : <b>${state.alt.toFixed(1)} km</b></p>
            <p class="text-xs text-slate-300">Vitesse : <b>${state.speed.toFixed(2)} km/s</b></p>
          </div>
        `);
      }
    }

    // Événements d'interaction
    catSelect.addEventListener('change', (e) => loadCategory(e.target.value));
    satSelect.addEventListener('change', (e) => selectSatellite(e.target.value));

    // Démarrage initial
    loadCategory('stations');

    // Boucle de mise à jour paramétrée à 1000 ms (1 seconde)
    setInterval(() => updatePosition(false), 1000);
  </script>
</body>
</html>
